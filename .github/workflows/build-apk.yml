name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Bundle native-plugin JS (db.js, photo.js)
        run: npm run build

      - name: Set up Java (capacitor-community/sqlite requires JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore/cache debug signing key
        # Without this, every CI run generates a brand-new debug keystore,
        # so every APK is signed differently and Android refuses to
        # install it over the previous version (silent failure — looks
        # like "nothing changed" because the old app just keeps running).
        # Caching this file means every build after the first reuses the
        # same signature, so installing the new APK over the old one
        # works like a normal app update.
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets + plugins into the Android project
        run: npx cap sync android

      - name: Patch Android project (permissions, backup rules, SDK versions)
        run: node scripts/patch-android.js

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stock-ledger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
