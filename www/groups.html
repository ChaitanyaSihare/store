<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Groups · Stock Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/groups.css">
</head>
<body class="groups-page">

<header>
  <div class="title-row">
    <h1 id="groupTitle">Groups</h1>
    <a href="index.html" class="groups-link">📋 Sheet</a>
  </div>
  <div id="breadcrumb" class="breadcrumb"></div>
</header>

<main class="groups-main">
  <section>
    <div class="section-label">Sub-groups</div>
    <div id="subgroupList" class="subgroup-grid"></div>
    <div class="add-inline">
      <input type="text" id="newGroupInput" placeholder="New group name">
      <button id="addGroupBtn">+</button>
    </div>
  </section>

  <section>
    <div class="section-label">Items in this group</div>
    <div id="itemGallery" class="item-gallery"></div>
    <button id="loadMoreBtn" class="add-row-bar" style="display:none;">Load more</button>
  </section>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jeep-sqlite@2/dist/jeep-sqlite/jeep-sqlite.esm.js" type="module"></script>
<script src="js/db.js"></script>
<script src="js/toast.js"></script>
<script src="js/groups.js"></script>
</body>
</html>
