<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stock Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="title-row">
    <h1>Stock Ledger</h1>
    <a href="groups.html" class="groups-link">🗂 Groups</a>
  </div>
  <div class="status-row mono" id="statusText">loading…</div>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Search any cell…">
  </div>
</header>

<div id="sheetWrap"></div>

<div class="summary-bar mono">
  <span>Rows: <b id="totalCount">0</b></span>
  <span>Stock value: <b id="totalValue">₹0</b></span>
</div>

<!-- Column options bottom sheet -->
<div class="modal-overlay" id="colMenuOverlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2 id="colMenuTitle">Column options</h2>
    <div class="field">
      <label>Column name</label>
      <input type="text" id="colMenuLabelInput">
    </div>
    <div class="field">
      <label>Cell type</label>
      <div class="type-options">
        <button class="type-btn" data-type="text">Text</button>
        <button class="type-btn" data-type="number">Number</button>
        <button class="type-btn" data-type="image">Image</button>
        <button class="type-btn" data-type="group">Group</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-danger" id="colDeleteBtn">Delete column</button>
      <button class="btn btn-primary" id="colMenuSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- New column bottom sheet -->
<div class="modal-overlay" id="newColOverlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h2>New column</h2>
    <div class="field">
      <label>Column name</label>
      <input type="text" id="newColLabelInput" placeholder="e.g. Supplier">
    </div>
    <div class="field">
      <label>Cell type</label>
      <div class="type-options" id="newColTypeOptions">
        <button class="type-btn active" data-type="text">Text</button>
        <button class="type-btn" data-type="number">Number</button>
        <button class="type-btn" data-type="image">Image</button>
        <button class="type-btn" data-type="group">Group</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="newColCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="newColSaveBtn">Add column</button>
    </div>
  </div>
</div>

<button id="addRowBtn" aria-label="Add row">+</button>
<div id="toast"></div>

<!-- jeep-sqlite: only needed when running in a plain browser (dev/testing).
     On a real Android build this element is unused; the native SQLite
     plugin talks to the device's SQLite directly. -->
<script src="https://cdn.jsdelivr.net/npm/jeep-sqlite@2/dist/jeep-sqlite/jeep-sqlite.esm.js" type="module"></script>

<script src="js/db.js"></script>
<script src="js/photo.js"></script>
<script src="js/sheet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
